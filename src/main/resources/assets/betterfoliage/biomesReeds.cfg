# List of biome filters that determines where reeds can / can't appear.
# If this file is found in multiple resourcepacks they will "stack" by resource priority, similarly to lang files.

# POSSIBLE FILTERS:
# There are two basic types of biome filters: biomeID or biome class filters.
# Both types of filters may optionally start with a "-" character. This makes the filter act as an entry on a blacklist,
# making the rule BLOCK biomes that match it instead of ALLOWING them.

# A biomeID filter is an integer number. For example:
# "2", "-53", "-0"
# This number is the biome's ID

# A biome class filter is a string representation of the java classpath of a class
# that inherits from the base biome class: net.minecraft.world.biome.BiomeGenBase.
# Additional sub-filters may be added after the classpath, separated by ":". These sub-filters are:
# n - The biome's name must match this exactly.
# r - Whether rain can happen in this biome. Valid values are "True" or "False".
# s - Whether snow can happen in this biome. Valid values are "True" or "False".
# t - The biome's temperature must be greater than this float value.
# T - The biome's temperature must be less than this float value.
# h - The biome's humidity (rainfall) must be greater than this float value.
# H - The biome's humidity (rainfall) must be less than this float value.

# Any biome where rain can occur, temperature >= 0.4 and humidity >= 0.4
net.minecraft.world.biome.BiomeGenBase:rTrue:t0.4:h0.4
